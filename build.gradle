import com.github.spotbugs.snom.SpotBugsTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle' // check style of code
	id 'com.github.spotbugs' version '6.5.13' // Check plugin portal for the latest version
	id 'pmd'
}

group = 'com.msal.angular'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group.startsWith('com.fasterxml.jackson')) {
			if (details.requested.name == 'jackson-annotations') {
				details.useVersion '2.21'
			} else {
				details.useVersion '2.21.8'
			}
			details.because('Mitigates CVE-2026-110879 and aligns all Jackson modules to 2.21.8')
		}
	}
}


dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// the implemention of the Azure entra-id
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	layered {
		enabled = true
	}
}

checkstyle {
	toolVersion = '14.4.0'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	ignoreFailures = false
	maxWarnings = 0
}

spotbugs {
	toolVersion = '4.9.8'
	ignoreFailures = false
	effort = 'max' // min, default, or max
	reportLevel = 'medium' // low, medium, or high
}

spotbugsMain {
	ignoreFailures = false
}

tasks.withType(SpotBugsTask).configureEach {
	reports {
		// Enable XML if other tools need to parse it, or keep it disabled if you only want HTML
		xml.required = false

		html {
			required = true
			// Using task.name ensures spotbugsMain and spotbugsTest generate separate files
			// (e.g., .../spotbugs/spotbugsMain.html and .../spotbugs/spotbugsTest.html)
			outputLocation = layout.buildDirectory.file("reports/spotbugs/${name}.html")
		}
	}
}

pmd {
	toolVersion = '7.16.0'
	ruleSets = ['category/java/errorprone.xml', 'category/java/bestpractices.xml']
	ignoreFailures = false
}